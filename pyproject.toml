[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbox-citadel-sdk-python"
version = "0.1.0"
description = "OpenBox governance for Citadel — 4142's LangGraph + CrewAI agent engine."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "openbox-langgraph-sdk-python>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["openbox_citadel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
